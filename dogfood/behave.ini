[behave]
paths=tests/features
show_skipped=false
show_timings=true
# Reports land in artifacts/reports/<run_id>/ (docs/spec/artifacts-layout.md): the stage
# environment hooks write manifest.json + summary.json there. For the HTML report point the
# formatter at the same directory, e.g.
#   set TUNER_REPORT_DIR=artifacts/reports/20260922T081200Z-api
#   behave --stage api -f html-pretty -o %TUNER_REPORT_DIR%/report.html

[behave.userdata]
base_url=
login_path=
home_url_keyword=

[behave.userdata.ui]
stage=ui

[behave.userdata.api]
stage=api

[behave.formatters]
html-pretty = behave_html_pretty_formatter:PrettyHTMLFormatter
