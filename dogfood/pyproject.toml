[project]
name = "tuner-dogfood"
version = "0.1.0"
description = "Dogfood workspace scaffolded by tuner-init from this platform repo; the SUT is the platform itself"
requires-python = ">=3.12,<3.14"
dependencies = [
    "tuner-testkit[all]",
]

# Virtual project: resolved into the workspace .venv, never built or installed.
# `packages/`, `apps/`, `config/` import from the dogfood cwd (tuner_testkit.project.ensure_project_on_path).
[tool.uv]
package = false

[tool.uv.sources]
tuner-testkit = { workspace = true }

[tool.tuner-testkit]
page_objects = "packages/page_objects"
api_objects = "packages/api_objects"
mocks = "data/mocks"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["apps", "packages", "tests/pytest"]
