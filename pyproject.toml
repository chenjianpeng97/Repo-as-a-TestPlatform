[project]
name = "innovammed-test-project-example"
version = "3.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
# 最小安装：packages.api_test（HTTP 客户端等）仅需 requests；避免 CI 单测拉 Playwright
dependencies = [
    "pymysql>=1.2.0",
    "pymssql>=2.3.0",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "requests>=2.33.1",
    "pydantic>=2",
    "faker>=37.0.0",
]

[project.optional-dependencies]
# 跑 packages/tests 等单元测试（含 packages/excel、test_excel_workbook 等）
test = [
    "pytest>=9.0.3",
    "openpyxl>=3.1.0",
]
# Behave + Playwright（BDD / UI 自动化）
bdd = [
    "behave>=1.2.6",
    "playwright>=1.54.0",
    "behave-html-pretty-formatter>=1.16.1",
]
# 终端代理抓包 → 自动维护 packages/api_objects（apps.api_recorder；extra 名保留 recorder）
recorder = [
    "mitmproxy>=11.1.3",
]
# 用 api_objects + data/mocks 起 mock server（packages.api_mock / apps.mock_server）
# httpx 供 fastapi.testclient 跑 packages/tests 里的 mock 单测
mock = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
]
# 本地全套：单测 + BDD/UI（等价于同时装 test 与 bdd）
dev = [
    "pytest>=9.0.3",
    "openpyxl>=3.1.0",
    "behave>=1.2.6",
    "playwright>=1.54.0",
    "behave-html-pretty-formatter>=1.16.1",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["packages*", "config*", "assets*", "apps*"]
namespaces = true
